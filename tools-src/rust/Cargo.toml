# Builds the website's PCB Toolkit from the vendored pcb_toolkit crate.
#
# vendor/* is copied verbatim by scripts/sync_vendor.py; the keys below are the ones that
# crate inherits with `workspace = true`, taken from the pcb_toolkit workspace.
[workspace]
resolver = "3"
members = ["vendor/*", "pcb-wasm"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nbean33/cem_tool_website"
homepage = "https://github.com/nbean33/pcb_toolkit"
authors = ["Alexander Kiselev <alex@akiselev.com>"]

[workspace.dependencies]
pcb-toolkit = { path = "vendor/pcb-toolkit" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
approx = "0.5"
wasm-bindgen = "0.2"

[workspace.lints.clippy]
disallowed_types = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
