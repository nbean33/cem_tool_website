[package]
name = "nec-solve"
version = "0.1.0"
description = "Fills and solves the NEC-2 wire interaction matrix; currents and input impedance."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nec-core = { workspace = true }
nec-cards = { workspace = true }
nec-geom = { workspace = true }
nec-kernel = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "solve"
harness = false

# cem_tool_website: faer's thread pool only where threads exist.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { workspace = true, features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
faer = { workspace = true }

[lints]
workspace = true
